# GOO IoT WebSockets & Backend Docker Compose
version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: goo-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
      # Exclude local environment dependencies from overriding container
      - /app/venv
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goo-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    env_file:
      - ./frontend/.env.example
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
