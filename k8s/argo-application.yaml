apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goo-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/yourusername/goo-k8s-manifests.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
